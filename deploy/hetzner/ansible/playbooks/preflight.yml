---
# Infrastructure preflight. Runs first in site.yml.
#
# It verifies the infrastructure and performs exactly ONE kind of repair: restoring the WireGuard
# policy routing on pp-back (ip route/ip rule in table {{ nat_table }}). That is transient kernel
# state, not configuration — it is regularly wiped by systemd-networkd reloads and must never
# require a manual `systemctl restart wg-quick@wg0` before a deploy.
#
# It does NOT install packages, generate keys, rewrite configs, touch DNS, the firewall, users,
# TLS files or secrets. Anything else that is missing fails with the bootstrap command to run.

- name: Preflight — backend connectivity
  hosts: backend
  gather_facts: false
  tags: [preflight, verify]
  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml
  tasks:
    - name: SSH reachable through the jump host
      ping:

    - name: WireGuard tunnel is up with a recent handshake
      become: true
      shell: |
        set -o pipefail
        wg show wg0 latest-handshakes | awk '{print $2}'
      args: { executable: /bin/bash }
      register: wg_handshake
      changed_when: false
      failed_when: >-
        wg_handshake.rc != 0 or
        wg_handshake.stdout | trim == '' or
        wg_handshake.stdout_lines[0] | int == 0 or
        (lookup('pipe', 'date +%s') | int) - (wg_handshake.stdout_lines[0] | int) > 300

    - name: Restore the WireGuard policy routing if networkd wiped it
      import_tasks: ../tasks/wg_route_ensure.yml

    - name: DNS resolves through systemd-resolved
      command: resolvectl query ifconfig.me
      register: dns_probe
      changed_when: false
      retries: 3
      delay: 5
      until: dns_probe.rc == 0

    - name: Public egress IP of pp-front (reference for the tunnel check)
      command: curl -sS --max-time 15 https://ifconfig.me
      delegate_to: "{{ groups['frontend'][0] }}"
      register: front_egress
      changed_when: false
      failed_when: false

    - name: Outbound traffic works from pp-back
      command: curl -sS --max-time 15 https://ifconfig.me
      register: egress_ip
      changed_when: false
      retries: 3
      delay: 5
      until: egress_ip.rc == 0
      failed_when: egress_ip.rc != 0 or (egress_ip.stdout | trim) == ''

    - name: Egress summary
      debug:
        msg: >-
          pp-back -> internet via {{ egress_ip.stdout | trim }}
          (pp-front egress {{ front_egress.stdout | default('') | trim | default('unknown', true) }},
          inventory frontend_public_ip {{ frontend_public_ip }})

    # The tunnel is the intended path, but a working direct egress must not block a deploy —
    # only a backend with no internet at all is fatal (checked above).
    - name: Warn when pp-back does not egress through pp-front
      debug:
        msg: >-
          WARNING: pp-back reaches the internet as {{ egress_ip.stdout | trim }}, which is neither the
          pp-front egress IP ({{ front_egress.stdout | default('') | trim | default('unknown', true) }})
          nor frontend_public_ip ({{ frontend_public_ip }}). Outbound traffic is NOT going through the
          WireGuard tunnel — fine for the deploy, but update frontend_public_ip in inventory.ini or
          re-run playbooks/bootstrap/bootstrap_nat.yml if the tunnel is supposed to carry it.
      when: >-
        (egress_ip.stdout | trim) not in
        [frontend_public_ip, (front_egress.stdout | default('') | trim)]

    - name: Base layout exists (created by bootstrap_backend_base.yml)
      stat: { path: "{{ item }}" }
      register: layout
      failed_when: not layout.stat.exists
      loop:
        - "{{ app_dir }}"
        - "{{ env_dir }}"
        - "{{ media_dir }}"

    - name: MongoDB is running (the backend refuses to start without it)
      wait_for: { host: 127.0.0.1, port: 27017, timeout: 10 }
      register: mongo_port
      ignore_errors: true

    - name: Fail with the bootstrap command when MongoDB is down
      fail:
        msg: >-
          MongoDB is not listening on 127.0.0.1:27017 on {{ inventory_hostname }}, so the backend
          cannot start. Install/repair it with:
          ansible-playbook -i inventory.ini playbooks/bootstrap/bootstrap_backend_base.yml --tags mongo
          Then check: sudo systemctl status mongod
      when: mongo_port is failed

- name: Preflight — frontend prerequisites
  hosts: frontend
  gather_facts: false
  tags: [preflight, verify]
  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml
  tasks:
    - name: SSH reachable
      ping:

    - name: Cloudflare Origin certificate and key are present
      stat: { path: "{{ item }}" }
      register: tls_files
      failed_when: not tls_files.stat.exists
      loop:
        - "{{ ssl_cert_path }}"
        - "{{ ssl_key_path }}"

    - name: Build toolchain and nginx are installed
      command: "{{ item }}"
      loop: ["nginx -v", "node -v", "yarn -v"]
      register: tooling
      changed_when: false
      failed_when: tooling.rc != 0
      ignore_errors: true

    - name: Fail with the bootstrap command when the toolchain is missing
      fail:
        msg: >-
          nginx / node / yarn are missing on {{ inventory_hostname }}. Run once:
          ansible-playbook -i inventory.ini playbooks/bootstrap/bootstrap_frontend_base.yml
      when: tooling is failed

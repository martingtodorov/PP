---
# Infrastructure preflight. Runs first in site.yml.
#
# It verifies the infrastructure and performs exactly ONE kind of repair: restoring the WireGuard
# policy routing on pp-back (ip route/ip rule in table {{ nat_table }}). That is transient kernel
# state, not configuration — it is regularly wiped by systemd-networkd reloads and must never
# require a manual `systemctl restart wg-quick@wg0` before a deploy.
#
# It does NOT install packages, generate keys, rewrite configs, touch DNS, the firewall, users,
# TLS files or secrets. Anything else that is missing fails with the bootstrap command to run.

- name: Preflight — backend connectivity
  hosts: backend
  gather_facts: false
  tags: [preflight, verify]
  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml
  tasks:
    - name: SSH reachable through the jump host
      ping:

    - name: WireGuard tunnel is up with a recent handshake
      become: true
      shell: |
        set -o pipefail
        wg show wg0 latest-handshakes | awk '{print $2}'
      args: { executable: /bin/bash }
      register: wg_handshake
      changed_when: false
      failed_when: >-
        wg_handshake.rc != 0 or
        wg_handshake.stdout | trim == '' or
        wg_handshake.stdout_lines[0] | int == 0 or
        (lookup('pipe', 'date +%s') | int) - (wg_handshake.stdout_lines[0] | int) > 300

    - name: Restore the WireGuard policy routing if networkd wiped it
      import_tasks: ../tasks/wg_route_ensure.yml

    - name: DNS resolves through systemd-resolved
      command: resolvectl query ifconfig.me
      register: dns_probe
      changed_when: false
      retries: 3
      delay: 5
      until: dns_probe.rc == 0

    - name: Outbound traffic exits through pp-front
      command: curl -sS --max-time 15 https://ifconfig.me
      register: egress_ip
      changed_when: false
      retries: 3
      delay: 5
      until: egress_ip.rc == 0
      failed_when: egress_ip.stdout | trim != frontend_public_ip

    - name: Egress summary
      debug:
        msg: "pp-back -> internet via {{ egress_ip.stdout | trim }} (expected {{ frontend_public_ip }} from the inventory)"

    - name: Base layout exists (created by bootstrap_backend_base.yml)
      stat: { path: "{{ item }}" }
      register: layout
      failed_when: not layout.stat.exists
      loop:
        - "{{ app_dir }}"
        - "{{ env_dir }}"
        - "{{ media_dir }}"

- name: Preflight — frontend prerequisites
  hosts: frontend
  gather_facts: false
  tags: [preflight, verify]
  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml
  tasks:
    - name: SSH reachable
      ping:

    - name: Cloudflare Origin certificate and key are present
      stat: { path: "{{ item }}" }
      register: tls_files
      failed_when: not tls_files.stat.exists
      loop:
        - "{{ ssl_cert_path }}"
        - "{{ ssl_key_path }}"

    - name: Build toolchain and nginx are installed
      command: "{{ item }}"
      loop: ["nginx -v", "node -v", "yarn -v"]
      register: tooling
      changed_when: false
      failed_when: tooling.rc != 0
      ignore_errors: true

    - name: Fail with the bootstrap command when the toolchain is missing
      fail:
        msg: >-
          nginx / node / yarn are missing on {{ inventory_hostname }}. Run once:
          ansible-playbook -i inventory.ini playbooks/bootstrap/bootstrap_frontend_base.yml
      when: tooling is failed

---
# ROUTINE FRONTEND DEPLOY — builds the SPA and swaps the web root. Build tooling is installed
# only if missing; nothing else on the host is touched.
- name: PurePeptide frontend build on pp-front
  hosts: frontend
  become: true
  vars:
    build_stamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"
    src_dir: "/opt/{{ app_name }}-src/{{ ref }}-{{ build_stamp }}"

  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml

  tasks:
    - name: Build toolchain must already be installed (bootstrap_frontend_base.yml installs it)
      command: "{{ item }}"
      loop: ["git --version", "node -v", "yarn -v", "rsync --version"]
      register: tooling
      changed_when: false
      ignore_errors: true
      tags: [base]

    - name: Point at the bootstrap playbook when the toolchain is missing
      fail:
        msg: >-
          Missing build tooling on {{ inventory_hostname }}. Run once:
          ansible-playbook -i inventory.ini playbooks/bootstrap/bootstrap_frontend_base.yml
      when: tooling is failed
      tags: [base]

    - name: Checkout the source
      git:
        repo: "{{ repo_url }}"
        dest: "{{ src_dir }}"
        version: "{{ ref }}"
        depth: 1
        accept_hostkey: true
      tags: [code]

    - name: Locate the SPA (frontend/package.json) in the checkout
      find:
        paths: "{{ src_dir }}"
        patterns: "package.json"
        recurse: true
        depth: 4
        file_type: file
      register: pkg_json
      tags: [code, build]

    - name: Fail with the checkout listing when the SPA is not in the ref
      fail:
        msg: >-
          '{{ ref }}' of {{ repo_url }} contains no frontend/package.json.
          {{ src_dir }} contains:
          {{ lookup('pipe', 'ls -1 ' ~ src_dir) | replace('\n', ', ') | default('(empty)', true) }}.
      when: (pkg_json.files | rejectattr('path', 'search', 'node_modules') | list | length) == 0
      tags: [code, build]

    - name: Derive the SPA directory from the real checkout layout
      set_fact:
        frontend_src_dir: >-
          {{ ((pkg_json.files | map(attribute='path') | reject('search', 'node_modules')
               | select('search', '/frontend/package.json') | sort | first)
              | default((pkg_json.files | map(attribute='path') | reject('search', 'node_modules')
                         | sort | first), true)) | dirname }}
      tags: [code, build]

    - name: Layout summary
      debug:
        msg: "SPA source at {{ frontend_src_dir }}"
      tags: [code, build]

    - name: Install frontend dependencies
      command: yarn install --frozen-lockfile
      args: { chdir: "{{ frontend_src_dir }}" }
      tags: [build]

    - name: Build the SPA
      command: yarn build
      args: { chdir: "{{ frontend_src_dir }}" }
      environment:
        # MUST stay empty: CRA bakes it in, empty == same origin so ONE build serves every domain
        REACT_APP_BACKEND_URL: ""
        REACT_APP_SITE_URL: "https://{{ site_domains[0] }}"
        NODE_OPTIONS: "--max-old-space-size=3072"
        CI: "false"
        GENERATE_SOURCEMAP: "false"
      tags: [build]

    - name: Ensure the web root exists
      file: { path: "{{ web_root }}", state: directory, owner: www-data, group: www-data, mode: "0755" }
      tags: [publish]

    - name: Stage the new build
      synchronize:
        src: "{{ frontend_src_dir }}/build/"
        dest: "{{ web_root }}/build.new/"
        delete: true
      delegate_to: "{{ inventory_hostname }}"
      tags: [publish]

    - name: Rotate build -> build.previous -> build
      shell: |
        set -e
        rm -rf {{ web_root }}/build.previous
        if [ -d {{ web_root }}/build ]; then mv {{ web_root }}/build {{ web_root }}/build.previous; fi
        mv {{ web_root }}/build.new {{ web_root }}/build
        chown -R www-data:www-data {{ web_root }}/build
      tags: [publish]

    - name: Prune old source trees
      shell: "ls -1dt /opt/{{ app_name }}-src/*/ | tail -n +{{ (releases_kept | int) + 1 }} | xargs -r rm -rf"
      changed_when: false
      tags: [publish]

    - name: Verify index.html was produced
      stat: { path: "{{ web_root }}/build/index.html" }
      register: index_html
      failed_when: not index_html.stat.exists
      tags: [verify, publish]

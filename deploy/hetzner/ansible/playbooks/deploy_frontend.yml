---
- name: PurePeptide frontend build on pp-front
  hosts: frontend
  become: true
  vars:
    build_stamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"
    src_dir: "/opt/{{ app_name }}-src/{{ ref }}-{{ build_stamp }}"

  tasks:
    - name: Install build tooling
      apt: { name: [git, curl, ca-certificates, rsync], update_cache: true, state: present }
      tags: [base]

    - name: NodeSource key
      shell: |
        set -o pipefail
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args: { creates: /etc/apt/keyrings/nodesource.gpg, executable: /bin/bash }
      tags: [base]

    - name: NodeSource repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
        filename: nodesource
        state: present
      tags: [base]

    - name: Install Node.js
      apt: { name: nodejs, update_cache: true, state: present }
      tags: [base]

    - name: Install yarn (npm causes breaking changes in this project)
      npm: { name: yarn, global: true, state: present }
      tags: [base]

    - name: Checkout the source
      git:
        repo: "{{ repo_url }}"
        dest: "{{ src_dir }}"
        version: "{{ ref }}"
        depth: 1
        accept_hostkey: true
      tags: [code]

    - name: Install frontend dependencies
      command: yarn install --frozen-lockfile
      args: { chdir: "{{ src_dir }}/frontend" }
      tags: [build]

    - name: Build the SPA
      command: yarn build
      args: { chdir: "{{ src_dir }}/frontend" }
      environment:
        # MUST stay empty: CRA bakes it in, empty == same origin so ONE build serves every domain
        REACT_APP_BACKEND_URL: ""
        REACT_APP_SITE_URL: "https://{{ site_domains[0] }}"
        NODE_OPTIONS: "--max-old-space-size=3072"
        CI: "false"
        GENERATE_SOURCEMAP: "false"
      tags: [build]

    - name: Ensure the web root exists
      file: { path: "{{ web_root }}", state: directory, owner: www-data, group: www-data, mode: "0755" }
      tags: [publish]

    - name: Stage the new build
      synchronize:
        src: "{{ src_dir }}/frontend/build/"
        dest: "{{ web_root }}/build.new/"
        delete: true
      delegate_to: "{{ inventory_hostname }}"
      tags: [publish]

    - name: Rotate build -> build.previous -> build
      shell: |
        set -e
        rm -rf {{ web_root }}/build.previous
        if [ -d {{ web_root }}/build ]; then mv {{ web_root }}/build {{ web_root }}/build.previous; fi
        mv {{ web_root }}/build.new {{ web_root }}/build
        chown -R www-data:www-data {{ web_root }}/build
      tags: [publish]

    - name: Prune old source trees
      shell: "ls -1dt /opt/{{ app_name }}-src/*/ | tail -n +{{ (releases_kept | int) + 1 }} | xargs -r rm -rf"
      changed_when: false
      tags: [publish]

    - name: Verify index.html was produced
      stat: { path: "{{ web_root }}/build/index.html" }
      register: index_html
      failed_when: not index_html.stat.exists
      tags: [verify, publish]

---
# BOOTSTRAP ONLY — OS packages, MongoDB, the directory layout, the media disk and backups.
# Not part of site.yml: it installs packages and restarts mongod.
#
# Every stage that installs packages is bracketed by tasks/wg_route_ensure.yml, because a package
# operation can trigger a networkd reload which used to wipe the WireGuard policy routing and left
# the host without internet or DNS half-way through the run (the "Temporary failure in name
# resolution" on the MongoDB key). Re-running this playbook is always safe.
- name: Backend base layer
  hosts: backend
  become: true
  pre_tasks:
    - import_tasks: ../../tasks/infra_defaults.yml
    - name: Routing and internet before we start
      import_tasks: ../../tasks/wg_route_ensure.yml

  tasks:
    - name: OS packages
      apt:
        name: [git, python3-venv, python3-pip, python3-dev, build-essential, curl, gnupg,
               libjpeg-dev, zlib1g-dev, libwebp-dev, rsync]
        update_cache: true
        state: present
      register: base_pkgs
      retries: 3
      delay: 10
      until: base_pkgs is succeeded
      tags: [base]

    - name: Routing survived the package installation
      import_tasks: ../../tasks/wg_route_ensure.yml
      tags: [base]

    - name: Directory layout
      file: { path: "{{ item }}", state: directory, owner: root, group: "{{ backend_service_user }}", mode: "0755" }
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/releases"
        - "{{ env_dir }}"
        - "{{ backup_dir }}"
      tags: [base]

    - name: Persistent media directory (created once, never wiped)
      file:
        path: "{{ media_dir }}"
        state: directory
        owner: "{{ backend_service_user }}"
        group: "{{ backend_service_user }}"
        mode: "0755"
      tags: [base, media]

    # ---------------- mongodb ----------------
    # MongoDB does not publish every version for every Ubuntu release (7.0 has no 'noble' repo, and
    # brand-new releases have none at all), so probe what really exists instead of guessing.
    #
    # A previously added, non-existent repo (e.g. 7.0/noble) poisons EVERY `apt update` on the host,
    # so the stale source list is removed before anything else.
    - name: Drop any previously added mongodb-org source list
      file: { path: "{{ item }}", state: absent }
      loop:
        - /etc/apt/sources.list.d/mongodb-org.list
        - /etc/apt/sources.list.d/mongodb-org.sources
      register: stale_mongo_repo
      tags: [mongo]

    - name: Refresh the apt cache without the broken repo
      apt: { update_cache: true }
      when: stale_mongo_repo is changed
      retries: 3
      delay: 5
      register: clean_cache
      until: clean_cache is succeeded
      tags: [mongo]
    - name: Candidate MongoDB repositories, most preferred first
      set_fact:
        mongo_repo_candidates: >-
          {{ ([ansible_distribution_release] + mongo_supported_codenames) | unique | list }}
      tags: [mongo]

    # A repository can exist and still be useless: dists/resolute/mongodb-org/8.0 ships only
    # mongodb-database-tools, with no mongodb-org-server. So check the package index itself.
    - name: Probe which mongodb-org repositories actually ship the server package
      shell: >-
        curl -fsS --max-time 30
        "https://repo.mongodb.org/apt/ubuntu/dists/{{ item.1 }}/mongodb-org/{{ item.0 }}/multiverse/binary-amd64/Packages"
        | grep -c '^Package: mongodb-org-server$' || true
      args: { executable: /bin/bash }
      loop: "{{ mongo_major_candidates | product(mongo_repo_candidates) | list }}"
      loop_control: { label: "{{ item.0 }} / {{ item.1 }}" }
      register: mongo_probe
      changed_when: false
      tags: [mongo]

    - name: Select the newest MongoDB version that has packages for this release
      set_fact:
        mongo_selected: >-
          {{ (mongo_probe.results | rejectattr('stdout', 'search', '^0$')
              | map(attribute='item') | list | first) | default([], true) }}
      tags: [mongo]

    - name: Fail when MongoDB publishes nothing usable
      fail:
        msg: >-
          No mongodb-org repository ships mongodb-org-server for {{ ansible_distribution }}
          {{ ansible_distribution_version }} ({{ ansible_distribution_release }}). Probed:
          {{ mongo_major_candidates | join(', ') }} against
          {{ ([ansible_distribution_release] + mongo_supported_codenames) | unique | join(', ') }}.
          Set mongo_major / mongo_supported_codenames in group_vars/all.yml.
      when: mongo_selected | length == 0
      tags: [mongo]

    - name: Use the selected version and codename
      set_fact:
        mongo_major: "{{ mongo_selected[0] }}"
        mongo_repo_codename: "{{ mongo_selected[1] }}"
      tags: [mongo]

    - name: Which MongoDB repository will be used
      debug:
        msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_distribution_release }}) → mongodb-org {{ mongo_major }} repo for
          '{{ mongo_repo_codename }}'
      tags: [mongo]

    - name: MongoDB apt key
      get_url:
        url: "https://pgp.mongodb.com/server-{{ mongo_major }}.asc"
        dest: /etc/apt/trusted.gpg.d/mongodb.asc
        mode: "0644"
        force: true
      register: mongo_key
      retries: 3
      delay: 10
      until: mongo_key is succeeded
      tags: [mongo]

    - name: MongoDB repository (cache refreshed separately so a bad repo cannot abort this task)
      apt_repository:
        repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu {{ mongo_repo_codename }}/mongodb-org/{{ mongo_major }} multiverse"
        filename: mongodb-org
        state: present
        update_cache: false
      tags: [mongo]

    - name: Refresh the apt cache with the MongoDB repository
      apt: { update_cache: true }
      register: mongo_cache
      retries: 3
      delay: 5
      until: mongo_cache is succeeded
      tags: [mongo]

    - name: Install mongodb-org
      block:
        - name: apt install mongodb-org
          apt: { name: mongodb-org, update_cache: true, state: present }
          register: mongo_pkgs
          retries: 3
          delay: 10
          until: mongo_pkgs is succeeded
      rescue:
        - name: What apt would do (unmet dependencies show up here)
          command: apt-get install -s mongodb-org
          register: apt_sim
          changed_when: false
          failed_when: false

        - name: Report why mongodb-org cannot be installed
          fail:
            msg: |
              mongodb-org {{ mongo_major }} from the '{{ mongo_repo_codename }}' repository cannot be
              installed on {{ ansible_distribution_release }}.
              --- apt-get install -s mongodb-org ---
              {{ apt_sim.stdout | default('(no output)') }}
              {{ apt_sim.stderr | default('') }}
      tags: [mongo]

    - name: Routing survived the MongoDB installation
      import_tasks: ../../tasks/wg_route_ensure.yml
      tags: [mongo]

    - name: Bind MongoDB to localhost only
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^\s*bindIp:'
        line: "  bindIp: 127.0.0.1"
      notify: restart mongod
      tags: [mongo]

    - name: mongod drop-in directory
      file: { path: /etc/systemd/system/mongod.service.d, state: directory, mode: "0755" }
      tags: [mongo]

    # MongoDB 8.x refuses to start on Linux >= 6.19: its vendored TCMalloc is incompatible with the
    # new restartable-sequences behaviour (SERVER-121912) and no patched release exists. The upstream
    # workaround is glibc.pthread.rseq=1 — setting it to 0 causes memory corruption instead.
    - name: Kernel workaround for MongoDB 8.x (SERVER-121912)
      copy:
        dest: /etc/systemd/system/mongod.service.d/10-pp-rseq.conf
        mode: "0644"
        content: |
          # Managed by Ansible ({{ app_name }}). Kernel {{ ansible_kernel }}.
          # MongoDB 8.x + Linux >= 6.19: TCMalloc/rseq incompatibility (SERVER-121912).
          [Service]
          Environment=GLIBC_TUNABLES=glibc.pthread.rseq=1
      register: mongo_rseq
      tags: [mongo]

    - name: Enable mongod
      systemd: { name: mongod, enabled: true, state: started, daemon_reload: true }
      tags: [mongo]

    - name: Restart mongod when the kernel workaround changed
      systemd: { name: mongod, state: restarted, daemon_reload: true }
      when: mongo_rseq is changed
      tags: [mongo]

    - name: Flush handlers so a pending mongod restart happens before we verify
      meta: flush_handlers
      tags: [mongo]

    - name: MongoDB accepts connections on 127.0.0.1:27017
      block:
        - name: Wait for the MongoDB port
          wait_for: { host: 127.0.0.1, port: 27017, timeout: 90 }
      rescue:
        - name: mongod journal
          command: journalctl -u mongod -n 60 --no-pager
          register: mongod_journal
          changed_when: false
          failed_when: false

        - name: Report why MongoDB is not running
          fail:
            msg: |
              MongoDB is installed but not accepting connections on 127.0.0.1:27017.
              The backend cannot start without it.
              --- journalctl -u mongod ---
              {{ mongod_journal.stdout | default('(no output)') }}
      tags: [mongo, verify]

    # ---------------- backups ----------------
    - name: Nightly backup (database + media + env)
      import_tasks: ../../tasks/backup.yml
      tags: [backup]

  post_tasks:
    - name: Routing and internet are still healthy at the end of the run
      import_tasks: ../../tasks/wg_route_ensure.yml

    - name: DNS still resolves
      command: resolvectl query ifconfig.me
      changed_when: false
      tags: [verify]

  handlers:
    - name: restart mongod
      systemd: { name: mongod, state: restarted }

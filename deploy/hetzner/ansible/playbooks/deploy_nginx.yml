---
# ROUTINE nginx DEPLOY — renders the site config and reloads. It never touches TLS files,
# the firewall, users or networking.
- name: nginx site config on pp-front
  hosts: frontend
  become: true

  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml

  tasks:
    - name: Existing Cloudflare Origin certificate must be in place (never generated here)
      stat: { path: "{{ item }}" }
      register: certs
      failed_when: not certs.stat.exists
      loop:
        - "{{ ssl_cert_path }}"
        - "{{ ssl_key_path }}"
      tags: [config]

    - name: Read the nginx version
      shell: nginx -v 2>&1 | sed 's#.*/##'
      register: nginx_version
      changed_when: false
      tags: [config]

    # nginx >= 1.25.1 deprecates "listen ... http2"; older versions do not know "http2 on;"
    - name: Choose the HTTP/2 syntax
      set_fact:
        nginx_http2_directive: "{{ 'http2on' if (nginx_version.stdout | trim is version('1.25.1', '>=')) else 'listen' }}"
      tags: [config]

    - name: Render the site config
      template:
        src: ../templates/nginx-purepeptide.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
        mode: "0644"
        backup: true
      notify: reload nginx
      tags: [config]

    - name: Enable the site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
        state: link
        force: true
      notify: reload nginx
      tags: [config]

    - name: Validate the configuration
      command: nginx -t
      changed_when: false
      tags: [config, verify]

    - name: Ensure nginx is running
      systemd: { name: nginx, enabled: true, state: started }
      tags: [service]

    # DNS-independent on purpose: some of site_domains still point at the old Shopify store
    # (purepeptide.bg answers 404 from Cloudflare), so a public request proves nothing about this
    # server. Resolve the canonical host to this machine instead and try every address it may be
    # bound to — nginx here does NOT listen on 127.0.0.1.
    # Handlers normally run at the very end of the play, i.e. AFTER the checks below. When a check
    # failed, the play aborted BEFORE the reload, so the freshly enabled site config was never
    # loaded and nginx kept listening on :80 only -> Cloudflare 521. Flush them here.
    - name: Apply pending nginx reloads before verifying
      meta: flush_handlers
      tags: [verify]

    # Self-healing: the config on disk asks for 443, but the running master may predate it (a
    # previous run died before its handler). A reload/restart is the only way to open the socket.
    - name: nginx must be listening on 443
      shell: |
        set -o pipefail
        if ss -ltn | grep -qE ':443\s'; then echo "already listening on 443"; exit 0; fi
        echo "no 443 socket — restarting nginx"
        systemctl restart nginx
        for i in 1 2 3 4 5; do
          sleep 2
          ss -ltn | grep -qE ':443\s' && { echo "443 is up"; exit 0; }
        done
        echo "nginx still does not listen on 443" >&2
        exit 1
      args: { executable: /bin/bash }
      register: nginx_443
      changed_when: "'restarting nginx' in nginx_443.stdout"
      tags: [verify, config]

    - name: Where does nginx listen?
      shell: "ss -ltnp 2>/dev/null | grep -E ':443|:80|nginx' || true"
      register: nginx_listen
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Listening sockets on pp-front
      debug:
        msg: "{{ nginx_listen.stdout_lines | default(['(ss produced no output)']) }}"
      tags: [verify]

    - name: Public API smoke test (nginx -> backend on this server, no DNS involved)
      block:
        - name: Ask nginx for /api/settings on every local address
          shell: |
            set -o pipefail
            ok=0
            for target in 127.0.0.1 {{ frontend_private_ip }} {{ frontend_public_ip }}; do
              code=$(curl -ksS -o /tmp/pp-smoke.json -w '%{http_code}' --max-time 15 \
                     --resolve '{{ canonical_domain }}:443:'"$target" \
                     'https://{{ canonical_domain }}/api/settings' 2>/dev/null || echo 000)
              echo "$target:443 -> $code"
              if [ "$code" = "200" ]; then ok=1; echo "$target" > /tmp/pp-target; break; fi
            done
            head -c 200 /tmp/pp-smoke.json 2>/dev/null; echo
            test "$ok" = "1"
          args: { executable: /bin/bash }
          register: api_check
          retries: 3
          delay: 5
          until: api_check is succeeded
          changed_when: false
      rescue:
        - name: nginx status
          command: systemctl status nginx --no-pager -l
          register: nginx_status
          changed_when: false
          failed_when: false

        - name: The listen directives nginx really uses
          shell: "nginx -T 2>/dev/null | grep -nE 'server_name|listen ' | head -40 || true"
          register: nginx_conf
          changed_when: false
          failed_when: false

        - name: Report why nginx did not answer
          fail:
            msg: |
              /api/settings did not answer 200 on any local address.
              --- attempts ---
              {{ api_check.stdout | default('(no output)') }}
              {{ api_check.stderr | default('') }}
              --- listening sockets ---
              {{ nginx_listen.stdout | default('(none)') }}
              --- nginx -T (server_name / listen) ---
              {{ nginx_conf.stdout | default('') }}
              --- systemctl status nginx ---
              {{ nginx_status.stdout | default('') }}
      tags: [verify]

    - name: Which of the domains actually reach this server? (informational)
      shell: |
        for d in {{ site_domains | join(' ') }}; do
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$d/api/settings" || echo 000)
          srv=$(curl -sSI --max-time 15 "https://$d/api/settings" 2>/dev/null | grep -i '^server:' | tr -d '\r')
          echo "$d -> $code   ${srv:-no server header}"
        done
      args: { executable: /bin/bash }
      register: domain_map
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Domain routing summary
      debug:
        msg: |
          {{ domain_map.stdout | default('') }}
          A domain that answers 404 with 'server: cloudflare' still points at the old Shopify store —
          switch its DNS to pp-front ({{ frontend_public_ip | default('the frontend server') }}).
      tags: [verify]

    - name: Courier endpoint (informational only)
      shell: |
        target=$(cat /tmp/pp-target 2>/dev/null || echo {{ frontend_public_ip }})
        curl -ksS -o /tmp/pp-couriers.json -w 'countries -> %{http_code}\n' --max-time 20 \
          --resolve '{{ canonical_domain }}:443:'"$target" \
          'https://{{ canonical_domain }}/api/nextcart/countries' || true
        head -c 200 /tmp/pp-couriers.json 2>/dev/null; echo
      args: { executable: /bin/bash }
      register: courier_check
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Courier check result
      debug:
        msg: |
          {{ courier_check.stdout | default('') }}
          Empty or non-200 means the checkout has no couriers: the backend serves
          backend/data/nextcart/ snapshots when NEXTCART_SNAPSHOT_ONLY=true — check that the release
          contains that directory and re-run deploy_backend.yml.
      tags: [verify]

  handlers:
    - name: reload nginx
      systemd: { name: nginx, state: reloaded }

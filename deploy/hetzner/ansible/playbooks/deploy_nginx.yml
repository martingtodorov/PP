---
# ROUTINE nginx DEPLOY — renders the site config and reloads. It never touches TLS files,
# the firewall, users or networking.
- name: nginx site config on pp-front
  hosts: frontend
  become: true

  tasks:
    - name: Existing Cloudflare Origin certificate must be in place (never generated here)
      stat: { path: "{{ item }}" }
      register: certs
      failed_when: not certs.stat.exists
      loop:
        - "{{ ssl_cert_path }}"
        - "{{ ssl_key_path }}"
      tags: [config]

    - name: Read the nginx version
      shell: nginx -v 2>&1 | sed 's#.*/##'
      register: nginx_version
      changed_when: false
      tags: [config]

    # nginx >= 1.25.1 deprecates "listen ... http2"; older versions do not know "http2 on;"
    - name: Choose the HTTP/2 syntax
      set_fact:
        nginx_http2_directive: "{{ 'http2on' if (nginx_version.stdout | trim is version('1.25.1', '>=')) else 'listen' }}"
      tags: [config]

    - name: Render the site config
      template:
        src: ../templates/nginx-purepeptide.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
        mode: "0644"
        backup: true
      notify: reload nginx
      tags: [config]

    - name: Enable the site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
        state: link
        force: true
      notify: reload nginx
      tags: [config]

    - name: Validate the configuration
      command: nginx -t
      changed_when: false
      tags: [config, verify]

    - name: Ensure nginx is running
      systemd: { name: nginx, enabled: true, state: started }
      tags: [service]

    - name: Public API smoke test
      uri: { url: "https://{{ site_domains[0] }}/api/nextcart/countries", status_code: 200 }
      register: api_check
      retries: 5
      delay: 5
      until: api_check.status == 200
      tags: [verify]

  handlers:
    - name: reload nginx
      systemd: { name: nginx, state: reloaded }

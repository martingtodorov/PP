---
# ROUTINE nginx DEPLOY — renders the site config and reloads. It never touches TLS files,
# the firewall, users or networking.
- name: nginx site config on pp-front
  hosts: frontend
  become: true

  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml

  tasks:
    # Every Cloudflare zone needs its own Origin certificate (one cert cannot cover another zone).
    # The four per-zone certs were uploaded by hand, but nothing referenced them, so all five
    # domains rendered into a single 443 block behind origin.pem — which only covers
    # *.purepeptide-labs.bg. It survived only because Cloudflare runs in "Full", not "Full (strict)".
    - name: Look for a per-zone certificate
      stat: { path: "{{ ssl_cert_path | dirname }}/{{ item }}.pem" }
      register: zone_pem
      loop: "{{ site_domains }}"
      changed_when: false
      tags: [config]

    - name: Look for a per-zone key
      stat: { path: "{{ ssl_cert_path | dirname }}/{{ item }}.key" }
      register: zone_key
      loop: "{{ site_domains }}"
      changed_when: false
      tags: [config]

    - name: A zone with its own certificate uses it; the rest keep the shared one
      set_fact:
        pp_zone_certs: >-
          {{ (pp_zone_certs | default({}, true)) | combine({
               item.0.item: {'cert': (ssl_cert_path | dirname) ~ '/' ~ item.0.item ~ '.pem',
                             'key':  (ssl_cert_path | dirname) ~ '/' ~ item.0.item ~ '.key'} }) }}
      when: item.0.stat.exists and item.1.stat.exists
      loop: "{{ zone_pem.results | zip(zone_key.results) | list }}"
      loop_control: { label: "{{ item.0.item }}" }
      tags: [config]

    - name: Certificate per domain (group_vars wins over what was found on disk)
      set_fact:
        site_tls_certs: "{{ (pp_zone_certs | default({}, true)) | combine(site_tls_certs | default({}, true)) }}"
      tags: [config]

    - name: Report which zones have their own certificate on disk
      debug:
        msg: >-
          found: {{ pp_zone_certs | default({}, true) | list }} |
          missing (will use {{ ssl_cert_path }}):
          {{ site_domains | difference(pp_zone_certs | default({}, true) | list) }} |
          .pem present but no matching .key:
          {{ zone_pem.results | selectattr('stat.exists') | map(attribute='item') | list
             | difference(zone_key.results | selectattr('stat.exists') | map(attribute='item') | list) }}
      tags: [config]

    - name: Map each domain to the certificate it will be served with
      set_fact:
        pp_cert_by_domain: >-
          {{ dict(site_domains | zip(site_domains | map('extract', site_tls_certs)
             | map('default', {'cert': ssl_cert_path}, true) | map(attribute='cert') | list)) }}
      tags: [config]

    - name: Show which certificate each domain will use
      debug:
        msg: "{{ pp_cert_by_domain }}"
      tags: [config]

    # www.* is served over TLS from the same certificate as the apex, so the Origin cert must carry
    # both names (Cloudflare issues "zone, *.zone" by default).
    - name: Every certificate must cover the apex and the www hostname of its zone
      shell: |
        python3 - <<'PY'
        import json, subprocess, sys
        pairs = json.loads(r'''{{ pp_cert_by_domain | to_json }}''')
        bad = []
        for domain, cert in pairs.items():
            text = subprocess.run(["openssl", "x509", "-in", cert, "-noout", "-text"],
                                  capture_output=True, text=True).stdout
            block = text.split("Subject Alternative Name:")[1].split("\n")[1] if \
                "Subject Alternative Name:" in text else ""
            sans = [p.strip()[4:] for p in block.split(",") if p.strip().startswith("DNS:")]
            for host in (domain, "www." + domain):
                covered = host in sans or any(
                    s.startswith("*.") and host.endswith(s[1:]) and host.count(".") == s.count(".")
                    for s in sans)
                if not covered:
                    bad.append(f"{cert} does not cover {host} (SANs: {', '.join(sans) or 'none'})")
        if bad:
            print("\n".join(bad))
            sys.exit(1)
        print("every certificate covers its apex and www hostname")
        PY
      args: { executable: /bin/bash }
      register: cert_coverage
      changed_when: false
      failed_when: cert_coverage.rc != 0
      tags: [config, verify]

    - name: Existing Cloudflare Origin certificates must be in place (never generated here)
      stat: { path: "{{ item }}" }
      register: certs
      failed_when: not certs.stat.exists
      loop: >-
        {{ ([ssl_cert_path, ssl_key_path]
            + (site_tls_certs | default({}, true)).values() | map(attribute='cert') | list
            + (site_tls_certs | default({}, true)).values() | map(attribute='key') | list) | unique }}
      tags: [config]

    - name: Read the nginx version
      shell: nginx -v 2>&1 | sed 's#.*/##'
      register: nginx_version
      changed_when: false
      tags: [config]

    # nginx >= 1.25.1 deprecates "listen ... http2"; older versions do not know "http2 on;"
    - name: Choose the HTTP/2 syntax
      set_fact:
        nginx_http2_directive: "{{ 'http2on' if (nginx_version.stdout | trim is version('1.25.1', '>=')) else 'listen' }}"
      tags: [config]

    - name: Render the site config
      template:
        src: ../templates/nginx-purepeptide.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
        mode: "0644"
        backup: true
      notify: reload nginx
      tags: [config]

    - name: Enable the site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
        state: link
        force: true
      notify: reload nginx
      tags: [config]

    - name: Validate the configuration
      command: nginx -t
      changed_when: false
      tags: [config, verify]

    - name: Ensure nginx is running
      systemd: { name: nginx, enabled: true, state: started }
      tags: [service]

    # DNS-independent on purpose: some of site_domains still point at the old Shopify store
    # (purepeptide.bg answers 404 from Cloudflare), so a public request proves nothing about this
    # server. Resolve the canonical host to this machine instead and try every address it may be
    # bound to — nginx here does NOT listen on 127.0.0.1.
    # Handlers normally run at the very end of the play, i.e. AFTER the checks below. When a check
    # failed, the play aborted BEFORE the reload, so the freshly enabled site config was never
    # loaded and nginx kept listening on :80 only -> Cloudflare 521. Flush them here.
    - name: Apply pending nginx reloads before verifying
      meta: flush_handlers
      tags: [verify]

    # Self-healing: the config on disk asks for 443, but the running master may predate it (a
    # previous run died before its handler). A reload/restart is the only way to open the socket.
    - name: nginx must be listening on 443
      shell: |
        set -o pipefail
        if ss -ltn | grep -qE ':443\s'; then echo "already listening on 443"; exit 0; fi
        echo "no 443 socket — restarting nginx"
        systemctl restart nginx
        for i in 1 2 3 4 5; do
          sleep 2
          ss -ltn | grep -qE ':443\s' && { echo "443 is up"; exit 0; }
        done
        echo "nginx still does not listen on 443" >&2
        exit 1
      args: { executable: /bin/bash }
      register: nginx_443
      changed_when: "'restarting nginx' in nginx_443.stdout"
      tags: [verify, config]

    - name: Where does nginx listen?
      shell: "ss -ltnp 2>/dev/null | grep -E ':443|:80|nginx' || true"
      register: nginx_listen
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Listening sockets on pp-front
      debug:
        msg: "{{ nginx_listen.stdout_lines | default(['(ss produced no output)']) }}"
      tags: [verify]

    - name: Public API smoke test (nginx -> backend on this server, no DNS involved)
      block:
        - name: Ask nginx for /api/settings on every local address
          shell: |
            set -o pipefail
            ok=0
            for target in 127.0.0.1 {{ frontend_private_ip }} {{ frontend_public_ip }}; do
              code=$(curl -ksS -o /tmp/pp-smoke.json -w '%{http_code} %{size_download}b' --max-time 15 \
                     --resolve '{{ canonical_domain }}:443:'"$target" \
                     'https://{{ canonical_domain }}/api/settings' 2>/dev/null || echo '000 0b')
              echo "$target:443 -> $code"
              if [ "${code%% *}" = "200" ]; then ok=1; echo "$target" > /tmp/pp-target; break; fi
            done
            # never echo the response body: it is Cyrillic and a byte-truncated cut makes Ansible
            # refuse the whole result ("invalid UTF8 string value")
            test "$ok" = "1"
          args: { executable: /bin/bash }
          register: api_check
          retries: 3
          delay: 5
          until: api_check is succeeded
          changed_when: false
      rescue:
        - name: nginx status
          command: systemctl status nginx --no-pager -l
          register: nginx_status
          changed_when: false
          failed_when: false

        - name: The listen directives nginx really uses
          shell: "nginx -T 2>/dev/null | grep -nE 'server_name|listen ' | head -40 || true"
          register: nginx_conf
          changed_when: false
          failed_when: false

        - name: Report why nginx did not answer
          fail:
            msg: |
              /api/settings did not answer 200 on any local address.
              --- attempts ---
              {{ api_check.stdout | default('(no output)') }}
              {{ api_check.stderr | default('') }}
              --- listening sockets ---
              {{ nginx_listen.stdout | default('(none)') }}
              --- nginx -T (server_name / listen) ---
              {{ nginx_conf.stdout | default('') }}
              --- systemctl status nginx ---
              {{ nginx_status.stdout | default('') }}
      tags: [verify]

    # Regression guard for the bug that broke every imported product image: nginx matches the
    # static-image regex before the /api/ prefix, so /api/files/*.png must be proven to reach the
    # backend (which answers JSON 404 for a missing file, not nginx's HTML 404 page).
    - name: Media must be served by the backend, not by the static image regex
      block:
        - name: Probe /api/files/*.png
          shell: |
            set -o pipefail
            target=$(cat /tmp/pp-target 2>/dev/null || echo {{ frontend_public_ip }})
            ct=$(curl -ksS -o /dev/null -w '%{content_type}' --max-time 15 \
                 --resolve '{{ canonical_domain }}:443:'"$target" \
                 'https://{{ canonical_domain }}/api/files/__ansible_probe__.png' || echo none)
            echo "content-type: $ct"
            case "$ct" in application/json*) exit 0 ;; *) exit 1 ;; esac
          args: { executable: /bin/bash }
          register: media_probe
          changed_when: false
      rescue:
        - name: Report the media routing problem
          fail:
            msg: |
              /api/files/*.png is NOT reaching the backend ({{ media_probe.stdout | default('no output') }}).
              nginx evaluates regex locations before prefix ones, so the static image regex is
              swallowing the media route. The rendered config must use "location ^~ /api/" and
              "location ^~ /api/files/" — re-render it and reload nginx.
      tags: [verify]

    # /sitemap.xml is an index that links child files (products, collections, pages, blogs). Only
    # /sitemap.xml used to be proxied, so every child answered the SPA's 404 and the index was dead.
    - name: Every sitemap file in the index must be served by the backend
      block:
        - name: Follow the sitemap index through nginx
          shell: |
            set -o pipefail
            target=$(cat /tmp/pp-target 2>/dev/null || echo {{ frontend_public_ip }})
            base="https://{{ canonical_domain }}"
            curl_() { curl -ksS --max-time 20 --resolve '{{ canonical_domain }}:443:'"$target" "$@"; }
            index=$(curl_ "$base/sitemap.xml")
            echo "$index" | grep -q '<sitemapindex' || { echo "not an index: ${index:0:200}"; exit 1; }
            rc=0
            for child in $(echo "$index" | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g'); do
              code=$(curl_ -o /dev/null -w '%{http_code}' "$child")
              echo "$child -> $code"
              [ "$code" = "200" ] || rc=1
            done
            exit $rc
          args: { executable: /bin/bash }
          register: sitemap_probe
          changed_when: false
      rescue:
        - name: Report the sitemap routing problem
          fail:
            msg: |
              A sitemap file in the index is not reaching the backend:
              {{ sitemap_probe.stdout | default('no output') }}
              The rendered config must contain "location ~ ^/sitemap[a-z0-9_]*\.xml$" proxying to
              the backend — re-render it and reload nginx.
      tags: [verify]


    - name: Which of the domains actually reach this server? (informational)
      shell: |
        for d in {{ site_domains | join(' ') }}; do
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$d/api/settings" || echo 000)
          srv=$(curl -sSI --max-time 15 "https://$d/api/settings" 2>/dev/null | grep -i '^server:' | tr -d '\r')
          echo "$d -> $code   ${srv:-no server header}"
        done
      args: { executable: /bin/bash }
      register: domain_map
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Domain routing summary
      debug:
        msg: |
          {{ domain_map.stdout | default('') }}
          A domain that answers 404 with 'server: cloudflare' still points at the old Shopify store —
          switch its DNS to pp-front ({{ frontend_public_ip | default('the frontend server') }}).
      tags: [verify]

    - name: Courier endpoint (informational only)
      shell: |
        target=$(cat /tmp/pp-target 2>/dev/null || echo {{ frontend_public_ip }})
        curl -ksS -o /tmp/pp-couriers.json -w 'countries -> %{http_code}\n' --max-time 20 \
          --resolve '{{ canonical_domain }}:443:'"$target" \
          'https://{{ canonical_domain }}/api/nextcart/countries' || true
        # ASCII-only summary — the payload holds Cyrillic country names
        python3 -c "import json;d=json.load(open('/tmp/pp-couriers.json'));print('countries in the reply:',len(d.get('countries') or []))" 2>/dev/null \
          || echo "could not parse the courier reply"
      args: { executable: /bin/bash }
      register: courier_check
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Courier check result
      debug:
        msg: |
          {{ courier_check.stdout | default('') }}
          Empty or non-200 means the checkout has no couriers: the backend serves
          backend/data/nextcart/ snapshots when NEXTCART_SNAPSHOT_ONLY=true — check that the release
          contains that directory and re-run deploy_backend.yml.
      tags: [verify]

  handlers:
    - name: reload nginx
      systemd: { name: nginx, state: reloaded }

---
# WireGuard NAT gateway: pp-back has no public IPv4 and reaches the internet through pp-front.
# Run once (and again only if the tunnel keys/IPs change).
- name: Gateway on pp-front
  hosts: frontend
  become: true
  tags: [gateway]
  tasks:
    - name: Install wireguard + iptables
      apt:
        name: [wireguard, wireguard-tools, iptables, iptables-persistent]
        update_cache: true
        state: present

    - name: Detect public interface
      shell: ip -o -4 route show to default | awk '{print $5; exit}'
      register: detected_iface
      changed_when: false

    - name: Set public interface fact
      set_fact:
        public_iface: "{{ nat_public_iface | default(detected_iface.stdout | trim) }}"

    - name: Generate front WireGuard keys
      shell: |
        umask 077
        test -f /etc/wireguard/front.key || wg genkey > /etc/wireguard/front.key
        wg pubkey < /etc/wireguard/front.key > /etc/wireguard/front.pub
      args:
        creates: /etc/wireguard/front.pub

    - name: Read front keys
      slurp: { src: "/etc/wireguard/{{ item }}" }
      register: front_keys
      loop: [front.key, front.pub]

    - name: Store front keys as facts
      set_fact:
        wg_front_private: "{{ (front_keys.results[0].content | b64decode) | trim }}"
        wg_front_public: "{{ (front_keys.results[1].content | b64decode) | trim }}"

    - name: Generate back WireGuard keys on the gateway (transferred to pp-back below)
      shell: |
        umask 077
        test -f /etc/wireguard/back.key || wg genkey > /etc/wireguard/back.key
        wg pubkey < /etc/wireguard/back.key > /etc/wireguard/back.pub
      args:
        creates: /etc/wireguard/back.pub

    - name: Read back keys
      slurp: { src: "/etc/wireguard/{{ item }}" }
      register: back_keys
      loop: [back.key, back.pub]

    - name: Store back keys as facts
      set_fact:
        wg_back_private: "{{ (back_keys.results[0].content | b64decode) | trim }}"
        wg_back_public: "{{ (back_keys.results[1].content | b64decode) | trim }}"

    - name: Enable IPv4 forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Render wg0 on the gateway
      template:
        src: ../templates/wg0-front.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: restart wg-front

    - name: Enable wg-quick@wg0
      systemd: { name: "wg-quick@wg0", enabled: true, state: started }

  handlers:
    - name: restart wg-front
      systemd: { name: "wg-quick@wg0", state: restarted }

- name: Tunnel client on pp-back
  hosts: backend
  become: true
  tags: [client]
  vars:
    wg_back_private: "{{ hostvars[groups['frontend'][0]].wg_back_private }}"
    wg_front_public: "{{ hostvars[groups['frontend'][0]].wg_front_public }}"
    front_public_ip: "{{ hostvars[groups['frontend'][0]].ansible_host }}"
  tasks:
    - name: Install wireguard
      apt: { name: [wireguard, wireguard-tools], update_cache: true, state: present }

    - name: Render wg0 on the client
      template:
        src: ../templates/wg0-back.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: restart wg-back

    - name: Enable wg-quick@wg0
      systemd: { name: "wg-quick@wg0", enabled: true, state: started }

    - name: Verify outbound internet through the tunnel
      shell: curl -sS --max-time 15 https://ifconfig.me
      register: nat_check
      changed_when: false
      tags: [verify]

    - name: Show the public IP seen by pp-back
      debug:
        msg: "pp-back exits via {{ nat_check.stdout }} (must equal {{ front_public_ip }})"
      tags: [verify]

  handlers:
    - name: restart wg-back
      systemd: { name: "wg-quick@wg0", state: restarted }

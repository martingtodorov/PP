---
# ROUTINE APPLICATION DEPLOY — code, dependencies, env, service. No infrastructure.
# It does NOT install MongoDB, create users, touch SSH, WireGuard, DNS, firewall or the media disk.
- name: PurePeptide backend — application deploy
  hosts: backend
  become: true
  vars:
    # searched in order; the first one present in the checkout wins
    prod_requirements_candidates:
      - deploy/requirements-prod.txt
      - backend/requirements-prod.txt
      - requirements-prod.txt
      - deploy/hetzner/requirements-prod.txt
    # only available on the Emergent package index — must never be installed on the server
    platform_only_packages: [emergentintegrations]

  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml
    # `--tags config,service` skips the checkout, so there is no new release directory. Everything
    # after that (server.py lookup, .env symlink, systemd unit) must then work on the release that
    # is currently live, otherwise the run dies with "no backend/server.py" in an empty directory.
    - name: Does this run deploy code?
      set_fact:
        code_selected: >-
          {{ (('all' in ansible_run_tags) or ('code' in ansible_run_tags))
             and ('code' not in ansible_skip_tags) and ('all' not in ansible_skip_tags) }}
      tags: [always]

    - name: Resolve the release that is currently live
      command: "readlink -f {{ app_dir }}/current"
      register: live_release
      changed_when: false
      failed_when: false
      when: not (code_selected | bool)
      tags: [always]

    - name: A config/service-only run needs an already deployed release
      fail:
        msg: >-
          {{ app_dir }}/current does not point at a release, so there is no code to configure.
          Run the full deploy once (or at least --tags code,publish) before using
          --tags {{ ansible_run_tags | join(',') }}.
      when:
        - not (code_selected | bool)
        - live_release.rc != 0 or (live_release.stdout | default('') | trim) in ['', app_dir ~ '/current']
      tags: [always]

    # A lookup() inside vars: is re-evaluated on EVERY reference, so `date +%s` produced a different
    # release_dir for each task: git cloned into ...230942 while the next task looked at ...230943
    # and found an empty directory. set_fact freezes the value for the whole run.
    - name: Freeze the release directory for this run
      set_fact:
        release_dir: >-
          {{ (app_dir ~ '/releases/' ~ ref ~ '-' ~ lookup('pipe', 'date +%Y%m%d%H%M%S'))
             if (code_selected | bool) else (live_release.stdout | trim) }}
      tags: [always]

    - name: Release directory
      debug:
        msg: >-
          {{ 'deploying ' ~ ref ~ ' into ' ~ release_dir if code_selected | bool
             else 'no code in this run — reconfiguring the live release ' ~ release_dir }}
      tags: [always]

    - name: The tunnel routing must be in place (git/pip need the internet)
      import_tasks: ../tasks/wg_route_ensure.yml

  tasks:
    - name: Assert the base layout exists (run bootstrap_backend_base.yml if this fails)
      stat: { path: "{{ item }}" }
      register: layout
      failed_when: not layout.stat.exists
      loop:
        - "{{ app_dir }}"
        - "{{ env_dir }}"
        - "{{ media_dir }}"
      tags: [code, config]

    # ---------------- code ----------------
    - name: Checkout the release
      git:
        repo: "{{ repo_url }}"
        dest: "{{ release_dir }}"
        version: "{{ ref }}"
        depth: 1
        accept_hostkey: true
      tags: [code]

    - name: Diagnostics — the first two levels of the checkout
      find: { paths: "{{ release_dir }}", file_type: any, recurse: true, depth: 2 }
      register: release_tree
      tags: [code, config, service, media]

    - name: Locate the backend application (server.py) in the checkout
      find:
        paths: "{{ release_dir }}"
        patterns: "server.py"
        recurse: true
        depth: 4
        file_type: file
      register: server_py
      tags: [code, config, service, media]

    - name: Fail with the checkout listing when the application is not in the ref
      fail:
        msg: >-
          '{{ ref }}' of {{ repo_url }} contains no backend/server.py, so there is nothing to deploy.
          {{ release_dir }} contains:
          {{ release_tree.files | map(attribute='path') | map('regex_replace', '^' ~ release_dir ~ '/', '')
             | sort | join(', ') | default('(empty)', true) }}.
          Push the application (backend/, frontend/, deploy/) to '{{ ref }}' and re-run.
      when: server_py.files | length == 0
      tags: [code, config, service, media]

    - name: Derive the application paths from the real checkout layout
      set_fact:
        backend_src_dir: >-
          {{ ((server_py.files | map(attribute='path') | select('search', '/backend/server.py') | sort | first)
              | default((server_py.files | map(attribute='path') | sort | first), true)) | dirname }}
      tags: [code, config, service, media]

    - name: Application subdirectory inside the repository
      set_fact:
        backend_rel_path: "{{ backend_src_dir | regex_replace('^' ~ release_dir ~ '/?', '') }}"
      tags: [code, config, service, media]

    - name: Layout summary
      debug:
        msg: "backend code lives in '{{ backend_rel_path }}' of the repository"
      tags: [code, config, service, media]

    - name: Create the virtualenv (kept between releases)
      command: "python3 -m venv {{ app_dir }}/venv"
      args: { creates: "{{ app_dir }}/venv/bin/python" }
      tags: [code]

    # ---------------- requirements: find the real file, never assume one path ----------------
    - name: Search the whole release for a requirements file
      find:
        paths: "{{ release_dir }}"
        patterns: ["requirements-prod.txt"]
        recurse: true
        depth: 4
        file_type: file
      register: req_found
      tags: [code]

    - name: What did the checkout actually deliver? (diagnostics)
      find: { paths: "{{ release_dir }}", file_type: any, depth: 1 }
      register: release_tree
      tags: [code]

    - name: Pick the production requirements file
      set_fact:
        backend_requirements: >-
          {{ ((req_found.files | map(attribute='path') | select('search', 'requirements-prod.txt') | sort | first)
              | default('', true)) }}
      tags: [code]

    - name: Fail with a clear message when the release ships no production requirements file
      fail:
        msg: >-
          No requirements-prod.txt in {{ release_dir }} (ref '{{ ref }}').
          Files found by the recursive search:
          {{ req_found.files | map(attribute='path') | join(', ') | default('none', true) }}.
          Push deploy/requirements-prod.txt to '{{ ref }}'. It is a MINIMAL list of the packages the
          backend imports — never a `pip freeze` of the development environment, whose pins conflict
          on the server's Python and include index-only packages
          ({{ platform_only_packages | join(', ') }}).
      when: backend_requirements | length == 0
      tags: [code]

    - name: Requirements file in use
      debug:
        msg: "pip -r {{ backend_requirements }}"
      tags: [code]

    - name: Install Python dependencies (portable list — no platform-only packages)
      pip:
        requirements: "{{ backend_requirements }}"
        virtualenv: "{{ app_dir }}/venv"
      tags: [code]

    # ---------------- config ----------------
    - name: Render backend.env from the vault (no defaults — every value comes from group_vars)
      template:
        src: ../templates/backend.env.j2
        dest: "{{ env_dir }}/backend.env"
        owner: root
        group: "{{ backend_service_user }}"
        mode: "0640"
        backup: true
      notify: restart backend
      tags: [config]

    - name: Symlink backend.env into the release (management scripts read it)
      file:
        src: "{{ env_dir }}/backend.env"
        dest: "{{ backend_src_dir }}/.env"
        state: link
        force: true
      tags: [config]

    - name: Render the systemd unit
      template:
        src: ../templates/purepeptide-backend.service.j2
        dest: "/etc/systemd/system/{{ app_name }}-backend.service"
        mode: "0644"
      notify: [reload systemd, restart backend]
      tags: [service]

    # ---------------- publish ----------------
    - name: Point previous -> the currently live release
      shell: |
        if [ -L {{ app_dir }}/current ]; then
          ln -sfn "$(readlink {{ app_dir }}/current)" {{ app_dir }}/previous
        fi
      changed_when: false
      tags: [publish]

    - name: Point current -> the new release
      file: { src: "{{ release_dir }}", dest: "{{ app_dir }}/current", state: link, force: true }
      notify: restart backend
      tags: [publish]

    - name: Own the release
      file: { path: "{{ release_dir }}", owner: root, group: "{{ backend_service_user }}", recurse: true }
      tags: [publish]

    # AFTER "Own the release": the recursive chown above would hand this directory back to root and
    # the service could no longer write the WebP cache
    - name: Image cache directory (writable by the service)
      file:
        path: "{{ backend_src_dir }}/.image_cache"
        state: directory
        owner: "{{ backend_service_user }}"
        group: "{{ backend_service_user }}"
        mode: "0755"
      tags: [config, publish]

    - name: The media disk must be writable by the service (uploads and imports land there)
      file:
        path: "{{ media_dir }}"
        state: directory
        owner: "{{ backend_service_user }}"
        group: "{{ backend_service_user }}"
        recurse: true
      tags: [publish, media]

    - name: Enable and start the backend
      systemd: { name: "{{ app_name }}-backend", enabled: true, state: started, daemon_reload: true }
      tags: [service, publish]

    - name: Prune old releases (media, env and database are untouched)
      shell: "ls -1dt {{ app_dir }}/releases/*/ | tail -n +{{ (releases_kept | int) + 1 }} | xargs -r rm -rf"
      changed_when: false
      tags: [publish]

    # ---------------- backups ----------------
    - name: Nightly backup of database + media + env (pp-backup / pp-restore)
      import_tasks: ../tasks/backup.yml
      tags: [backup]

    # ---------------- optional, never automatic ----------------
    - name: Import media from the managed storage (only with -e run_media_import=true)
      command: "{{ app_dir }}/venv/bin/python export_media_to_disk.py"
      args: { chdir: "{{ app_dir }}/current/{{ backend_rel_path }}" }
      become_user: "{{ backend_service_user }}"
      register: media_import
      changed_when: "'downloaded: 0' not in media_import.stdout"
      when: run_media_import | default(false) | bool
      tags: [media]

    - name: Import the real catalog from the Matrixify export (only with -e run_catalog_import=true)
      command: >-
        {{ app_dir }}/venv/bin/python matrixify_import.py
        --only {{ catalog_import_steps | default('collections,products,pages,articles,redirects,discounts') }}
      args: { chdir: "{{ app_dir }}/current/{{ backend_rel_path }}" }
      become_user: "{{ backend_service_user }}"
      register: catalog_import
      changed_when: "'import finished' in (catalog_import.stderr | default('')) + (catalog_import.stdout | default(''))"
      when: run_catalog_import | default(false) | bool
      notify: restart backend
      tags: [catalog]

    # ---------------- verify ----------------
    # Handlers run at the end of the play, so a failing check would abort the run BEFORE the
    # backend was restarted with the new code. Flush them first.
    - name: Apply pending backend restarts before verifying
      meta: flush_handlers
      tags: [verify, publish]

    # NB: there is no GET /api/ route — use a real endpoint, otherwise the health check 404s forever.
    - name: Health check
      block:
        - name: Wait for the API to answer
          uri: { url: "http://127.0.0.1:8001/api/settings", status_code: 200 }
          retries: 10
          delay: 3
          register: health
          until: health.status | default(0) == 200
      rescue:
        - name: Service status
          command: "systemctl status {{ app_name }}-backend --no-pager -l"
          register: svc_status
          changed_when: false
          failed_when: false

        - name: Last 60 journal lines
          command: "journalctl -u {{ app_name }}-backend -n 60 --no-pager"
          register: svc_journal
          changed_when: false
          failed_when: false

        - name: Report why the backend is not answering
          fail:
            msg: |
              The backend did not answer on http://127.0.0.1:8001/api/settings.
              --- systemctl status ---
              {{ svc_status.stdout | default('(no output)') }}
              --- journal ---
              {{ svc_journal.stdout | default('(no output)') }}
      tags: [verify, publish]

    # uvicorn with --workers 1 runs a supervisor process PLUS one worker, so counting processes that
    # match 'uvicorn server:app' always returns 2. Check the unit and the process tree instead.
    - name: Assert the backend runs a single uvicorn worker
      shell: |
        set -o pipefail
        main=$(systemctl show -p MainPID --value {{ app_name }}-backend)
        conf=$(systemctl show -p ExecStart --value {{ app_name }}-backend \
               | grep -o -- '--workers [0-9]*' | awk '{print $2}')
        children=$(pgrep -P "$main" | wc -l)
        echo "configured=${conf:-1} children=${children}"
        test "${conf:-1}" = "1" || { echo "the unit asks for ${conf} workers" >&2; exit 1; }
        test "${children}" -le 1 || { echo "$children worker processes" >&2; exit 1; }
      args: { executable: /bin/bash }
      register: workers
      changed_when: false
      tags: [verify]

    - name: Courier / checkout API answers (catches a wrong NEXTCART_BASE_URL)
      block:
        - name: Wait for the courier endpoint
          uri: { url: "http://127.0.0.1:8001/api/nextcart/countries", status_code: 200 }
          register: couriers
          retries: 3
          delay: 3
          until: couriers.status | default(0) == 200 and (couriers.json.countries | default([]) | length) > 0
      rescue:
        - name: Which upstream is configured
          shell: "grep -E '^NEXTCART_' {{ env_dir }}/backend.env | sed 's/=.*KEY.*/=***/'"
          register: nextcart_conf
          changed_when: false
          failed_when: false

        - name: Can the server reach that upstream at all?
          shell: |
            url=$(grep -m1 '^NEXTCART_BASE_URL=' {{ env_dir }}/backend.env | cut -d= -f2-)
            shop=$(grep -m1 '^NEXTCART_SHOP=' {{ env_dir }}/backend.env | cut -d= -f2-)
            echo "GET $url (shop=$shop)"
            curl -s -o /dev/null -w 'upstream http status: %{http_code}\n' --max-time 20 "$url" || true
          args: { executable: /bin/bash }
          register: nextcart_probe
          changed_when: false
          failed_when: false

        # Non-blocking on purpose: a dead courier upstream must not stop the site from going live.
        # Run with -e require_couriers=true to make it a hard gate again.
        - name: Ask the upstream directly for the storefront config
          shell: |
            url=$(grep -m1 '^NEXTCART_BASE_URL=' {{ env_dir }}/backend.env | cut -d= -f2-)
            shop=$(grep -m1 '^NEXTCART_SHOP=' {{ env_dir }}/backend.env | cut -d= -f2-)
            curl -sS -o /tmp/pp-nextcart.json \
              -w 'storefront/config -> %{http_code}\n' --max-time 20 \
              "$url/api/shopify-app/storefront/config?shop=$shop&country=BG&locale=bg" || true
            # iconv -c drops the character the byte cut broke — an invalid UTF-8 byte makes Ansible
            # refuse the whole task result
            head -c 300 /tmp/pp-nextcart.json 2>/dev/null | iconv -c -f UTF-8 -t UTF-8; echo
          args: { executable: /bin/bash }
          register: nextcart_direct
          changed_when: false
          failed_when: false

        - name: Does the release ship the courier snapshot?
          shell: |
            dir="{{ backend_src_dir }}/data/nextcart"
            echo "snapshot dir: $dir"
            ls -1 "$dir" 2>&1 | head -5
            echo "files: $(ls -1 "$dir" 2>/dev/null | wc -l)"
            grep -m1 '^NEXTCART_SNAPSHOT_ONLY=' {{ env_dir }}/backend.env || echo "NEXTCART_SNAPSHOT_ONLY missing from backend.env"
            echo "deployed commit: $(git -C {{ release_dir }} rev-parse --short HEAD 2>/dev/null)"
          args: { executable: /bin/bash }
          register: nextcart_snap
          changed_when: false
          failed_when: false

        - name: What the backend logged about NextCart
          shell: "journalctl -u {{ app_name }}-backend -n 300 --no-pager | grep -i nextcart | tail -10 || true"
          args: { executable: /bin/bash }
          register: nextcart_log
          changed_when: false
          failed_when: false

        - name: Warn about the courier failure (the checkout will not offer delivery)
          debug:
            msg: |
              /api/nextcart/countries did not return couriers, so the checkout would be broken.
              --- {{ env_dir }}/backend.env ---
              {{ nextcart_conf.stdout | default('(no NEXTCART_* lines)') }}
              --- upstream reachability ---
              {{ nextcart_probe.stdout | default('') }}
              --- courier snapshot in the release ---
              {{ nextcart_snap.stdout | default('') }}
              --- direct call to the storefront API (this is the decisive status) ---
              {{ nextcart_direct.stdout | default('') }}
              {{ nextcart_direct.stderr | default('') }}
              --- backend log ---
              {{ nextcart_log.stdout | default('') }}
              NOTE: the working host is https://api.nextcartmanager.com —
              https://client.nextcartmanager.com answers 404 and breaks every courier call.
              Fix nextcart_base_url in group_vars/all.yml and re-run.

        - name: Stop the deploy when couriers are required
          fail:
            msg: "Couriers are down and require_couriers=true"
          when: require_couriers | default(false) | bool
      tags: [verify, publish]

    - name: Catalog answers with products
      uri: { url: "http://127.0.0.1:8001/api/products?locale=bg", status_code: 200 }
      register: catalog
      changed_when: false
      failed_when: (catalog.json | default([]) | length) == 0
      tags: [verify, publish]

  handlers:
    - name: reload systemd
      systemd: { daemon_reload: true }
    - name: restart backend
      systemd: { name: "{{ app_name }}-backend", state: restarted, daemon_reload: true }

---
# ROUTINE APPLICATION DEPLOY — code, dependencies, env, service. No infrastructure.
# It does NOT install MongoDB, create users, touch SSH, WireGuard, DNS, firewall or the media disk.
- name: PurePeptide backend — application deploy
  hosts: backend
  become: true
  vars:
    release_stamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"
    release_dir: "{{ app_dir }}/releases/{{ ref }}-{{ release_stamp }}"
    # searched in order; the first one present in the checkout wins
    prod_requirements_candidates:
      - deploy/requirements-prod.txt
      - backend/requirements-prod.txt
      - requirements-prod.txt
      - deploy/hetzner/requirements-prod.txt
    # only available on the Emergent package index — must never be installed on the server
    platform_only_packages: [emergentintegrations]

  pre_tasks:
    - import_tasks: ../tasks/infra_defaults.yml
    - name: The tunnel routing must be in place (git/pip need the internet)
      import_tasks: ../tasks/wg_route_ensure.yml

  tasks:
    - name: Assert the base layout exists (run bootstrap_backend_base.yml if this fails)
      stat: { path: "{{ item }}" }
      register: layout
      failed_when: not layout.stat.exists
      loop:
        - "{{ app_dir }}"
        - "{{ env_dir }}"
        - "{{ media_dir }}"
      tags: [code, config]

    # ---------------- code ----------------
    - name: Checkout the release
      git:
        repo: "{{ repo_url }}"
        dest: "{{ release_dir }}"
        version: "{{ ref }}"
        depth: 1
        accept_hostkey: true
      tags: [code]

    - name: The checkout must contain the backend application
      stat: { path: "{{ release_dir }}/backend/server.py" }
      register: app_entry
      failed_when: not app_entry.stat.exists
      tags: [code]

    - name: Create the virtualenv (kept between releases)
      command: "python3 -m venv {{ app_dir }}/venv"
      args: { creates: "{{ app_dir }}/venv/bin/python" }
      tags: [code]

    # ---------------- requirements: find the real file, never assume one path ----------------
    - name: Search the whole release for a requirements file
      find:
        paths: "{{ release_dir }}"
        patterns: ["requirements-prod.txt", "requirements.txt"]
        recurse: true
        depth: 4
        file_type: file
      register: req_found
      tags: [code]

    - name: What did the checkout actually deliver? (diagnostics)
      find: { paths: "{{ release_dir }}", file_type: any, depth: 1 }
      register: release_tree
      tags: [code]

    - name: Pick a requirements file — a *-prod.txt anywhere wins, then requirements.txt
      set_fact:
        backend_requirements: >-
          {{ ((req_found.files | map(attribute='path') | select('search', 'requirements-prod.txt') | sort | first)
              | default('', true)) }}
        dev_requirements_path: >-
          {{ ((req_found.files | map(attribute='path') | select('search', 'backend/requirements.txt') | sort | first)
              | default('', true)) }}
      tags: [code]

    - name: Fail with a clear message when the release ships no requirements file at all
      fail:
        msg: >-
          No requirements file in {{ release_dir }} (ref '{{ ref }}').
          Top level of the checkout: {{ release_tree.files | map(attribute='path') | map('basename') | sort | join(', ') }}.
          Files found by the recursive search: {{ req_found.files | map(attribute='path') | join(', ') | default('none', true) }}.
          Push deploy/requirements-prod.txt to '{{ ref }}' (generated with `pip freeze` minus
          {{ platform_only_packages | join(', ') }}).
      when:
        - backend_requirements | length == 0
        - dev_requirements_path | length == 0
      tags: [code]

    # backend/requirements.txt pins emergentintegrations, which only exists on the Emergent index.
    # Stripping it produces exactly the same list as deploy/requirements-prod.txt.
    - name: Derive a portable requirements file from backend/requirements.txt (fallback)
      shell: |
        set -o pipefail
        tmp=$(mktemp)
        grep -vEi '^({{ platform_only_packages | join("|") }})([=<>~!\[].*)?$' \
          {{ dev_requirements_path }} > "$tmp"
        if ! cmp -s "$tmp" {{ env_dir }}/requirements-prod.generated.txt; then
          install -m 0644 "$tmp" {{ env_dir }}/requirements-prod.generated.txt
          echo generated
        fi
        rm -f "$tmp"
      args: { executable: /bin/bash }
      register: generated_req
      changed_when: "'generated' in generated_req.stdout"
      when:
        - backend_requirements | length == 0
        - dev_requirements_path | length > 0
      tags: [code]

    - name: Use the derived file
      set_fact:
        backend_requirements: "{{ env_dir }}/requirements-prod.generated.txt"
      when:
        - backend_requirements | length == 0
        - dev_requirements_path | length > 0
      tags: [code]

    - name: Requirements file in use
      debug:
        msg: "pip -r {{ backend_requirements }}"
      tags: [code]

    - name: Install Python dependencies (portable list — no platform-only packages)
      pip:
        requirements: "{{ backend_requirements }}"
        virtualenv: "{{ app_dir }}/venv"
      tags: [code]

    # ---------------- config ----------------
    - name: Render backend.env from the vault (no defaults — every value comes from group_vars)
      template:
        src: ../templates/backend.env.j2
        dest: "{{ env_dir }}/backend.env"
        owner: root
        group: "{{ backend_service_user }}"
        mode: "0640"
        backup: true
      notify: restart backend
      tags: [config]

    - name: Symlink backend.env into the release (management scripts read it)
      file:
        src: "{{ env_dir }}/backend.env"
        dest: "{{ release_dir }}/backend/.env"
        state: link
        force: true
      tags: [config]

    - name: Image cache directory
      file:
        path: "{{ release_dir }}/backend/.image_cache"
        state: directory
        owner: "{{ backend_service_user }}"
        group: "{{ backend_service_user }}"
        mode: "0755"
      tags: [config]

    - name: Render the systemd unit
      template:
        src: ../templates/purepeptide-backend.service.j2
        dest: "/etc/systemd/system/{{ app_name }}-backend.service"
        mode: "0644"
      notify: [reload systemd, restart backend]
      tags: [service]

    # ---------------- publish ----------------
    - name: Point previous -> the currently live release
      shell: |
        if [ -L {{ app_dir }}/current ]; then
          ln -sfn "$(readlink {{ app_dir }}/current)" {{ app_dir }}/previous
        fi
      changed_when: false
      tags: [publish]

    - name: Point current -> the new release
      file: { src: "{{ release_dir }}", dest: "{{ app_dir }}/current", state: link, force: true }
      notify: restart backend
      tags: [publish]

    - name: Own the release
      file: { path: "{{ release_dir }}", owner: root, group: "{{ backend_service_user }}", recurse: true }
      tags: [publish]

    - name: Enable and start the backend
      systemd: { name: "{{ app_name }}-backend", enabled: true, state: started, daemon_reload: true }
      tags: [service, publish]

    - name: Prune old releases (media, env and database are untouched)
      shell: "ls -1dt {{ app_dir }}/releases/*/ | tail -n +{{ (releases_kept | int) + 1 }} | xargs -r rm -rf"
      changed_when: false
      tags: [publish]

    # ---------------- optional, never automatic ----------------
    - name: Import media from the managed storage (only with -e run_media_import=true)
      command: "{{ app_dir }}/venv/bin/python export_media_to_disk.py"
      args: { chdir: "{{ app_dir }}/current/backend" }
      become_user: "{{ backend_service_user }}"
      register: media_import
      changed_when: "'downloaded: 0' not in media_import.stdout"
      when: run_media_import | default(false) | bool
      tags: [media]

    # ---------------- verify ----------------
    - name: Health check
      uri: { url: "http://127.0.0.1:8001/api/", status_code: 200 }
      retries: 10
      delay: 3
      register: health
      until: health.status == 200
      tags: [verify, publish]

    - name: Assert exactly one uvicorn worker
      shell: "pgrep -fc 'uvicorn server:app'"
      register: workers
      changed_when: false
      failed_when: workers.stdout | trim != '1'
      tags: [verify]

    - name: Courier / checkout API answers (catches a wrong NEXTCART_BASE_URL)
      uri: { url: "http://127.0.0.1:8001/api/nextcart/countries", status_code: 200 }
      register: couriers
      retries: 3
      delay: 3
      until: couriers.status == 200
      failed_when: couriers.status != 200 or (couriers.json.countries | default([]) | length) == 0
      tags: [verify, publish]

    - name: Catalog answers with products
      uri: { url: "http://127.0.0.1:8001/api/products?locale=bg", status_code: 200 }
      register: catalog
      changed_when: false
      failed_when: (catalog.json | default([]) | length) == 0
      tags: [verify, publish]

  handlers:
    - name: reload systemd
      systemd: { daemon_reload: true }
    - name: restart backend
      systemd: { name: "{{ app_name }}-backend", state: restarted, daemon_reload: true }

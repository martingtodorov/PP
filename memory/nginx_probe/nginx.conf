events {}
http {
  access_log off;
  server {
    listen 127.0.0.1:8099;
    root /app/memory/nginx_probe/root;

    location ^~ /static/ { try_files $uri =404; }
    location = /index.html { try_files $uri =404; }

    location @prerender {
      proxy_pass http://127.0.0.1:8123/api/seo/prerender?path=$request_uri;
      proxy_intercept_errors on;
      error_page 500 502 503 504 = @spa;
    }
    location @spa { try_files /index.html =404; }
    location = / { try_files /prerender-the-home-page @prerender; }
    location / { try_files $uri @prerender; }
  }
}
